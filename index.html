  /* RAINY  RAINY ANIMATION */
        
    body{
    margin: 0;
    overflow-x: hidden;
    position: relative;
}

/* RAIN CONTAINER */
.rain{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 350px;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

/* RAIN DROPS */
.rain span{
    position: absolute;
    width: 2px;
    height: 80px;
    background: linear-gradient(transparent, white);
    opacity: 0.7;
    animation: rain 1s linear infinite;
}

/* DIFFERENT POSITIONS */
.rain span:nth-child(1){ left: 5%; animation-delay: 0s; }
.rain span:nth-child(2){ left: 10%; animation-delay: 0.2s; }
.rain span:nth-child(3){ left: 15%; animation-delay: 0.4s; }
.rain span:nth-child(4){ left: 20%; animation-delay: 0.1s; }
.rain span:nth-child(5){ left: 25%; animation-delay: 0.6s; }
.rain span:nth-child(6){ left: 30%; animation-delay: 0.3s; }
.rain span:nth-child(7){ left: 35%; animation-delay: 0.5s; }
.rain span:nth-child(8){ left: 40%; animation-delay: 0.2s; }
.rain span:nth-child(9){ left: 45%; animation-delay: 0.7s; }
.rain span:nth-child(10){ left: 50%; animation-delay: 0.1s; }
.rain span:nth-child(11){ left: 55%; animation-delay: 0.5s; }
.rain span:nth-child(12){ left: 60%; animation-delay: 0.3s; }
.rain span:nth-child(13){ left: 65%; animation-delay: 0.6s; }
.rain span:nth-child(14){ left: 70%; animation-delay: 0.2s; }
.rain span:nth-child(15){ left: 75%; animation-delay: 0.4s; }
.rain span:nth-child(16){ left: 80%; animation-delay: 0.7s; }
.rain span:nth-child(17){ left: 85%; animation-delay: 0.1s; }
.rain span:nth-child(18){ left: 90%; animation-delay: 0.5s; }
.rain span:nth-child(19){ left: 95%; animation-delay: 0.3s; }
.rain span:nth-child(20){ left: 98%; animation-delay: 0.6s; }

/* ANIMATION */
@keyframes rain{
    0%{
        transform: translateY(-120px);
    }

    100%{
        transform: translateY(500px);
    }
}
