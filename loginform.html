 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spiritual Inspiration Login-Form</title>

  <style>

    body{
     background-image: url("vejens\ background.jpg");
     background-position: center;
     background-repeat: no-repeat;
     background-size: cover;
    }

    .login-container{
      background-color: rgb(124, 120, 120);
      padding: 40px;
      width: 300px;
      border-radius: 20px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.4);
      border: 2px solid rgb(240, 173, 5);
    }

    .login-container h2{
      text-align: center;
      margin-bottom: 25px;
      color: #243b55;
     
      
    }

    .input-box{
      margin-bottom: 20px;
    }

    .input-box input{
      width: 100%;
      padding: 12px;

      border: 1px solid #ccc;
      border-radius: 6px;

      outline: none;
      font-size: 16px;
    }

    .input-box input:focus{
      border-color: #243b55;
    }

    .login-btn{
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 6px;

      background-color: #243b55;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    .login-btn:hover{
      background-color: #141e30;
    }

    .extra-links{
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .extra-links a{
      text-decoration: none;
      color: #243b55;
    }
    #nav {
      display: flex;
      justify-content: center;
      background-image: url("blackFlower.jpg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      list-style-type: none;
      color: gold;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 10px 16px;
      
     }
     #nav ul {
      display: flex;
      gap: 20px;
      list-style-type: none;
     }


  </style>
</head>

<body>
      <div id="nav">
            <nav>
       <ul>
        <li>Author</li>
        <li>contents</li>
        <li>contact</li>
       </ul>
      </nav>
      </div>
 <h1>Masinde Website</h1>
  <p>Spiritual Inspiration</p>

  <div class="login-container">

    <h2>Login</h2>

    <form>

      <div class="input-box">
        <input type="email" placeholder="Enter Email" required>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Enter Password" required>
      </div>

      <button class="login-btn">Login</button>

      <div class="extra-links">
        <p><a href="#">Forgot Password?</a></p>
        
      </div>

    </form>

  </div>   
</body>
</html>
