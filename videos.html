*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#383535;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

/* Video Gallery */
#video-container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    padding:20px;
    background:black;
 
}
#video-container :hover{
    
    cursor: pointer;
}


/* Each video box */
.video-card{
    width:100%;
    background:#111;
    border:2px solid gold;
    border-radius:10px;
    overflow:hidden;
}

/* Video fits perfectly inside the box */
  .video-card video{
    width:100%;
    height:250px;
    object-fit:contain;
    background:black;
    display:block;
}
/* Mobile */
@media(max-width:900px){
    #video-container{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    #video-container{
        grid-template-columns:1fr;
    }

    .video-card video{
        height:220px;
    }
}

     .footer {
        background: rgb(71, 63, 14);
        color: white;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        padding: 50px;
      }

      #copy {
        align-items: center;
        justify-content: center;
        display: flex;
        background-color: gold;
        color: black;
      }
